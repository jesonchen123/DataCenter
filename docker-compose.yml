services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_data_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  celery_worker:
    build: .
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - .:/app

volumes:
  postgres_data:

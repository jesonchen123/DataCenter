services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_data_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/chat_data_platform
      REDIS_URL: redis://redis:6379/0
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-your_api_key}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  celery_worker:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/chat_data_platform
      REDIS_URL: redis://redis:6379/0
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-your_api_key}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - .:/app

volumes:
  postgres_data:
